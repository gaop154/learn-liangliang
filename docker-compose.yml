x-defaults: &defaults
  restart: unless-stopped

services:
  gateway:
    image: caddy:2.8-alpine
    container_name: learn-gateway
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    <<: *defaults

  web:
    image: nginx:1.27-alpine
    container_name: learn-web
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    <<: *defaults

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learn-api
    env_file:
      - .env
    depends_on:
      - db
    <<: *defaults

  db:
    image: postgres:16-alpine
    container_name: learn-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learn_liangliang}
      POSTGRES_USER: ${POSTGRES_USER:-learn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    <<: *defaults

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
