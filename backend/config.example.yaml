# API 私有配置示例。Docker Compose 将宿主机 /opt/docker/learn-liangliang/config/config.yaml
# 只读挂载到 api 与 content-sync 容器的 /app/config.yaml，并以 APP_CONFIG_FILE 显式加载。
# 同机部署使用 network_mode: host：databaseUrl 直接填写宿主机 PostgreSQL 的用户名、密码和 127.0.0.1 端口。
# 本地非 Docker 启动时可复制为未提交的 backend/config.yaml；HTTP 调试时再将 cookieSecure 改为 false；不要提交真实配置或凭据。
# 显式设置的环境变量仍会覆盖本文件对应字段，但 Compose 不注入这些 API 配置变量。

databaseUrl: "postgres://learn:local_dev_password_123@127.0.0.1:5432/learn_liangliang?sslmode=disable"

app:
  addr: "127.0.0.1:8081"
  cookieName: "learn_session"
  cookieSecure: true
  sessionTtlHours: 720

admin:
  username: "admin"
  password: "local_admin_password_123"
  displayName: "管理员"
