server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location ~ /\. {
        deny all;
    }

    location ~* ^/(backend|deploy|utils|ssl)(/|$) {
        deny all;
    }

    location ~* ^/(Dockerfile|docker-compose\.yml|requirements\.txt|learn-liangliang\.conf|restart_nginx\.sh)$ {
        deny all;
    }

    location ~* \.(?:js\.map)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|eot|ttf|otf|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
