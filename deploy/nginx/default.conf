server {
    listen 80;
    server_name _;

    # 宿主机部署目录；与 README 中的 /opt/docker/learn-liangliang/src 保持一致。
    root /opt/docker/learn-liangliang/src;
    index index.html;

    charset utf-8;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /internal/authenticate {
        internal;
        proxy_pass http://127.0.0.1:8080/internal/authenticate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $uri;
        proxy_set_header X-Original-Method $request_method;
    }

    location @login {
        return 302 /login.html?next=$uri;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^/(backend|deploy|utils|ssl|content)(/|$) {
        deny all;
    }

    location ~* ^/(docker-compose\.yaml|docker-compose\.yml|requirements\.txt|README\.md|AGENTS\.md|CLAUDE\.md|\.env|\.env\.example)$ {
        deny all;
    }

    location ~* \.(?:js\.map)$ {
        return 404;
    }

    # 这些正则 location 必须位于公共资源缓存规则之前，
    # 防止受保护的 PDF 和内容私有资源绕过 auth_request。
    location = /专栏 {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location ~ ^/专栏/ {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location = /其他 {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location ~ ^/其他/ {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location = /reading-history.html {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri =404;
    }

    # 首页的两个等价入口都必须鉴权，避免直接访问 /index.html 绕过登录。
    location = / {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location = /index.html {
        auth_request /internal/authenticate;
        error_page 401 = @login;
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location / {
        try_files $uri $uri/ /content$uri /content$uri/index.html /content$uri/ =404;
    }

    location ~* \.(?:css|js)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        try_files $uri /content$uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?|eot|ttf|otf|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri /content$uri =404;
    }
}
